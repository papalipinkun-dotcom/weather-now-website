packages:
  - frontend/*
  - backend/*
  - shared/lib/*

# Supply-chain safety: only install package versions that have been public for
# at least 1 day. Needs pnpm 10.16 or newer.
minimumReleaseAge: 1440

# Shared dependency versions used as "catalog:" in the package.json files.
catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

overrides:
  esbuild: "0.28.2"
  # orval pins an older js-yaml than the CVE fix (>=4.3.2)
  js-yaml: '4.3.2'

allowBuilds:
  esbuild: true